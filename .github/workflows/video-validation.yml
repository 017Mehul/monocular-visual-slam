name: Recorded Driving Sequence Stability Validation
# Re-run on tracker/relocalizer changes so acceptance is based on the current main branch.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-validation.yml"
      - "slam/**"
      - "scripts/real_world_validation.py"
      - "scripts/download_kitti_subset.py"
      - "config.production.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorded-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download continuous KITTI driving sequence
        run: |
          python scripts/download_kitti_subset.py --destination dataset/dataset --sequences 00
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          root = Path("dataset/dataset")
          seq = root / "sequences" / "00"
          images = sorted((seq / "image_0").glob("*.png"))
          poses = root / "poses" / "00.txt"
          if len(images) < 1500 or not poses.is_file() or not (seq / "calib.txt").is_file():
              raise SystemExit("KITTI sequence 00 is incomplete for sustained validation")
          manifest = {
              "git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "dataset": "KITTI Odometry sequence 00",
              "source_frame_count": len(images),
              "validation_frames": 1500,
              "ground_truth_pose_count": sum(1 for _ in poses.open()),
              "continuity": "1500 consecutive original frames; no repeated/looped clip frames"
          }
          Path("outputs").mkdir(exist_ok=True)
          Path("outputs/driving_sequence_manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Run sustained consecutive-frame validation
        run: |
          python scripts/real_world_validation.py \
            --source dataset/dataset/sequences/00 \
            --frames 1500 \
            --output-dir outputs/video_validation \
            --min-tracking-rate 0.70 \
            --min-fps 5.0 \
            --max-slow-frame-rate 0.50 \
            --max-p95-frame-time-ms 180

      - name: Retain report, metrics and trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-driving-validation-${{ github.run_id }}
          path: |
            outputs/driving_sequence_manifest.json
            outputs/video_validation/
          if-no-files-found: warn
          retention-days: 30
