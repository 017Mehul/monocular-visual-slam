name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q slam scripts tests

      - name: Static checks
        run: python -m ruff check slam scripts tests --select E9,F63,F7,F82

      - name: Evaluation CLI smoke test
        run: |
          python slam/kitti_evaluation.py --help
          python scripts/kitti_large_benchmark.py --help
          python scripts/evaluate_loop_closure.py --help
          python scripts/real_world_validation.py --help
          python scripts/stress_validation.py --help

      - name: Unit tests
        run: |
          mkdir -p outputs
          python -m pytest -q --junitxml=outputs/pytest-report.xml

      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: outputs/pytest-report.xml
          if-no-files-found: warn
          retention-days: 30
