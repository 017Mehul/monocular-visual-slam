name: KITTI Multi-Sequence and Loop Retrieval Validation

# Avoid duplicate full-dataset downloads when rapid code pushes trigger new validations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kitti-validation.yml"
      - "scripts/download_kitti_subset.py"
      - "scripts/kitti_large_benchmark.py"
      - "scripts/evaluate_loop_closure.py"
      - "slam/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kitti-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download selected official KITTI sequences
        run: |
          python scripts/download_kitti_subset.py --destination dataset/dataset --sequences 00 01 02 05
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("dataset/dataset")
          sequences = {}
          for seq in ("00", "01", "02", "05"):
              images = sorted((root / "sequences" / seq / "image_0").glob("*.png"))
              poses = root / "poses" / f"{seq}.txt"
              calib = root / "sequences" / seq / "calib.txt"
              if len(images) < 2 or not poses.is_file() or not calib.is_file():
                  raise SystemExit(f"Incomplete KITTI sequence {seq}")
              sequences[seq] = {"image_count": len(images), "ground_truth_pose_lines": sum(1 for _ in poses.open()), "calibration_present": True}
          Path("outputs").mkdir(exist_ok=True)
          Path("outputs/kitti_dataset_manifest.json").write_text(json.dumps({
              "source": "KITTI odometry public AWS mirror (official archive)",
              "sequences": sequences
          }, indent=2))
          print(json.dumps(sequences, indent=2))
          PY

      - name: Run full multi-sequence accuracy and runtime benchmark
        continue-on-error: true
        id: full-benchmark
        run: |
          set +e
          python scripts/kitti_large_benchmark.py \
            --dataset-root dataset/dataset \
            --sequences 00 01 02 \
            --output-dir outputs/kitti_benchmark \
            --max-ate-rmse-m 25 \
            --max-rpe-translation-rmse-m 5 \
            --max-rpe-rotation-rmse-deg 5 \
            --min-tracking-success-rate 0.90 \
            --max-p95-frame-time-ms 250
          status=$?
          echo "benchmark_exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Benchmark exit code: $status (the explicit gate runs after diagnostics so artifacts are retained)"
          exit 0

      - name: Diagnose trajectory drift without loop corrections
        run: |
          python scripts/kitti_large_benchmark.py \
            --dataset-root dataset/dataset \
            --sequences 01 \
            --output-dir outputs/kitti_ablation_no_loop \
            --no-loop-closure
          python scripts/kitti_large_benchmark.py \
            --dataset-root dataset/dataset \
            --sequences 01 \
            --output-dir outputs/kitti_ablation_with_ba \
            --enable-ba

      - name: Evaluate loop-candidate precision and recall on revisiting sequences
        run: |
          python scripts/evaluate_loop_closure.py \
            --sequence dataset/dataset/sequences/00 \
            --ground-truth dataset/dataset/poses/00.txt \
            --frame-stride 10 --min-separation-frames 100 --revisit-radius-m 5 --similarity-threshold 0.80 \
            --output outputs/loop_closure_00.json
          python scripts/evaluate_loop_closure.py \
            --sequence dataset/dataset/sequences/05 \
            --ground-truth dataset/dataset/poses/05.txt \
            --frame-stride 10 --min-separation-frames 100 --revisit-radius-m 5 --similarity-threshold 0.80 \
            --output outputs/loop_closure_05.json

      - name: Compare trajectory with PnP disabled
        continue-on-error: true
        run: |
          python scripts/kitti_large_benchmark.py \
            --dataset-root dataset/dataset \
            --sequences 00 \
            --output-dir outputs/kitti_ablation_no_map_pnp \
            --no-map-pnp

      - name: Enforce accuracy and runtime acceptance thresholds
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/kitti_benchmark/benchmark_summary.json")
          if not path.is_file():
              raise SystemExit("FAIL: benchmark summary missing")
          summary = json.loads(path.read_text(encoding="utf-8"))
          if not summary.get("accuracy_thresholds_configured"):
              raise SystemExit("FAIL: no acceptance thresholds were configured")
          requested = summary.get("sequences_requested", [])
          results = {item.get("sequence"): item for item in summary.get("results", [])}
          failures = []
          for sequence in requested:
              result = results.get(sequence)
              if not result or not result.get("completed"):
                  failures.append(f"{sequence}: benchmark incomplete")
              elif result.get("accuracy_passed") is not True:
                  failures.append(
                      f"{sequence}: accuracy/runtime gate failed; "
                      f"ATE={result.get('ate_rmse_m')}, "
                      f"RPE_t={result.get('rpe_translation_rmse_m')}, "
                      f"RPE_r={result.get('rpe_rotation_rmse_deg')}, "
                      f"tracking={result.get('tracking_success_rate')}, "
                      f"P95={result.get('p95_frame_time_ms')}"
                  )
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("All requested KITTI sequences passed accuracy and runtime thresholds.")
          PY

      - name: Retain benchmark and loop-retrieval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitti-validation-${{ github.run_id }}
          path: |
            outputs/kitti_dataset_manifest.json
            outputs/kitti_benchmark/
            outputs/kitti_ablation_no_loop/
            outputs/kitti_ablation_with_ba/
            outputs/kitti_ablation_no_map_pnp/
            outputs/loop_closure_00.json
            outputs/loop_closure_05.json
          if-no-files-found: warn
          retention-days: 30
